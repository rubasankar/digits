version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: daily
    groups:
      python:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
