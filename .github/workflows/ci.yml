name: CI

on:
    push:
        branches: [main, develop]
        paths-ignore:
            - docs/**
    pull_request:
        branches: [main, develop]
        paths-ignore:
            - docs/**

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        uses: ./.github/workflows/lint.yml
    test:
        uses: ./.github/workflows/test.yml
