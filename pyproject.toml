[project]
name = "digits"
version = "0.1.0"
description = "Online self-hosted platform for smb store or shop"
readme = "README.md"
authors = [
  { name = "Rubasankar", email = "rubasankar@outlook.in" },
]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi>=25.1.0",
  "celery>=5.6.3",
  "django>=6.1",
  "django-allauth[headless,mfa,socialaccount]>=65.19.1",
  "django-compressor>=4.6.0",
  "django-cotton>=2.7.2",
  "django-cotton-ui>=0.3.2",
  "django-countries>=9.0.0",
  "django-environ>=0.14.0",
  "django-imagekit>=6.1.0",
  "django-model-utils>=5.0.0",
  "django-phonenumber-field[phonenumbers]>=8.5.0",
  "django-redis>=7.0.0",
  "django-structlog>=10.1.0",
  "django-stubs-ext>=6.0.7",
  "django-treebeard>=6.0.0",
  "flower>=2.0.1",
  "gunicorn>=26.0.0",
  "hiredis>=3.4.0",
  "labbui[icons]>=0.4.4",
  "pillow>=12.3.0",
  "python-slugify>=8.0.4",
  "redis>=8.0.1",
  "uvicorn[standard]>=0.52.3",
  "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
  "charset-normalizer>=3.4.9",
  "coverage>=7.15.2",
  "detect-secrets>=1.5.0",
  "django-coverage-plugin>=3.2.2",
  "django-debug-toolbar>=7.1.1",
  "django-extensions>=4.1",
  "django-stubs[compatible-mypy]>=6.1",
  "django-upgrade>=1.31.1",
  "djlint>=1.43.1",
  "factory-boy>=3.3.3",
  "graphviz>=0.21",
  "ipdb>=0.13.13",
  "mypy>=2.3.0",
  "pip-audit>=2.10.1",
  "pre-commit>=4.6.1",
  "pytest>=9.1.1",
  "pytest-django>=4.12.0",
  "pytest-sugar>=1.1.1",
  "ruff>=0.16.3",
  "sphinx>=9.1.0",
  "sphinx-autobuild>=2025.8.25",
  "watchfiles>=1.2.0",
  "werkzeug[watchdog]>=3.1.8",
]

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
