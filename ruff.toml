extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "COM812", # Conflicts with the formatter
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.force-single-line = true
[lint.per-file-ignores]
"manage.py" = ["PLC0415"]
"*/tests/*.py" = [
  "PLC0415", # local imports inside test methods are fine
  "PLR2004", # magic numbers in assertions are readable
  "S106",    # hardcoded passwords in test fixtures are intentional
  "SLF001",  # testing private methods is legitimate
  "BLE001",  # broad except in test helpers is acceptable
  "TRY301",  # abstract raise rule doesn't apply in tests
  "ERA001",  # commented-out explanatory notes in tests are fine
  "PT017",   # assertion-in-except: handled manually in some tests
  "N806",    # uppercase mock aliases (MockSvc, MP, etc.) are conventional
  "PT012",   # single-statement pytest.raises: handled case by case
  "E501",    # long lines with mock.patch strings are acceptable
]
